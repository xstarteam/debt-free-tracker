# X Star CI — Light tier (static, zero-dependency PWA).
# Job names are the required-check names for branch protection on `main`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # bash -eo pipefail: a failing command is never hidden by `| tee`

env:
  NODE_VERSION: "22"

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Unit tests (engine, money, i18n, storage)
        run: node --test "tests/*.test.mjs" 2>&1 | tee quality-unit.txt
      - name: Syntax, references, privacy and CSP checks
        run: node tools/check.mjs 2>&1 | tee quality-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate
          path: quality-*.txt

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned dev tooling (not app dependencies)
        run: |
          npm install --global playwright@1.56.1 axe-core@4.10.2
          npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Browser smoke + live checks
        run: |
          export PLAYWRIGHT_MODULE="$(npm root -g)/playwright"
          export AXE_PATH="$(npm root -g)/axe-core/axe.min.js"
          node tools/smoke.mjs --shots smoke-shots 2>&1 | tee e2e-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke
          path: |
            e2e-smoke.txt
            smoke-shots/

  secrets-history:
    name: secrets-history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — Light P9
      - name: gitleaks full-history scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --no-banner --redact --exit-code 1 \
            2>&1 | tee gitleaks-history.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-history
          path: gitleaks-history.txt

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [quality-gate, e2e-smoke, secrets-history]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Service worker matches the shipped files
        run: node tools/stamp-sw.mjs --check 2>&1 | tee build.txt
      - name: Assemble the deployable set (what Vercel serves)
        run: |
          rsync -a --exclude=.git --exclude-from=.vercelignore --exclude=.vercelignore ./ dist/
          (cd dist && find . -type f | sort) | tee -a build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: |
            build.txt
            dist/

# Never add `continue-on-error: true` to a required job.
# Never `echo` or dump `env` in any step.
